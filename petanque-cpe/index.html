<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9e1b22">
<title>กีฬาภายใน CPE | Live</title>
<link rel="icon" href="cpe-logo.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="cpe-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#9e1b22;--red2:#c93341;--soft:rgba(158,27,34,.08);--g:#05864a;--b:#2868cf;--p:#be319b;--gold:#d9a520;
--bg:#f2f5f8;--card:rgba(255,255,255,.74);--solid:#fff;--txt:#1b2026;--txt2:#5d6875;--txt3:#8b95a1;
--line:rgba(20,30,45,.09);--sh:0 4px 24px rgba(20,30,45,.07);--shl:0 18px 50px rgba(20,30,45,.13);--bl:blur(18px) saturate(180%)}
[data-theme=dark]{--bg:#0e1116;--card:rgba(28,34,43,.74);--solid:#1c222b;--txt:#e9edf2;--txt2:#a2adba;--txt3:#6f7c8a;
--line:rgba(255,255,255,.08);--soft:rgba(201,51,65,.14);--sh:0 4px 24px rgba(0,0,0,.35);--shl:0 18px 50px rgba(0,0,0,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:Kanit,sans-serif;color:var(--txt);background:var(--bg);transition:.4s;overflow-x:hidden}
.mesh{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.mesh i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:dr 22s ease-in-out infinite}
.mesh i:nth-child(1){width:44vw;height:44vw;top:-12%;left:-8%;background:rgba(158,27,34,.28)}
.mesh i:nth-child(2){width:38vw;height:38vw;bottom:-14%;right:-8%;background:rgba(40,104,207,.2);animation-delay:-7s}
.mesh i:nth-child(3){width:30vw;height:30vw;top:42%;right:24%;background:rgba(217,165,32,.16);animation-delay:-13s}
[data-theme=dark] .mesh i{opacity:.3}
@keyframes dr{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(4vw,-3vh) scale(1.12)}66%{transform:translate(-3vw,4vh) scale(.92)}}
.wm{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:0;opacity:.035;pointer-events:none}
.wm img{width:min(640px,64vw)}
.page{position:relative;z-index:1;max-width:1340px;margin:auto;padding:26px 20px 80px}
.glass{background:var(--card);backdrop-filter:var(--bl);-webkit-backdrop-filter:var(--bl);border:1px solid var(--line)}
.head{display:flex;align-items:center;gap:18px;padding:20px 24px;margin-bottom:16px;border-radius:24px;box-shadow:var(--sh);animation:rise .6s cubic-bezier(.22,1,.36,1) both}
.head>img{width:68px;height:68px;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(158,27,34,.28))}
.head div{flex:1;min-width:0}
.head h1{margin:0;font-size:clamp(1.15rem,3.3vw,1.95rem);font-weight:700;line-height:1.2;
background:linear-gradient(100deg,var(--red),var(--red2) 55%,var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.head p{margin:4px 0 0;color:var(--txt2);font-size:.88rem;font-weight:300}
.ic{width:44px;height:44px;flex-shrink:0;border:1px solid var(--line);border-radius:14px;background:var(--solid);color:var(--txt);font-size:1.15rem;cursor:pointer;display:grid;place-items:center;transition:.25s}
.ic:hover{transform:translateY(-2px);border-color:var(--red)}
/* live bar */
.livebar{display:flex;align-items:center;gap:10px;padding:10px 18px;margin-bottom:14px;border-radius:16px;box-shadow:var(--sh);font-size:.85rem;color:var(--txt2)}
.dotlive{width:9px;height:9px;border-radius:50%;background:#22c55e;animation:pls 1.6s infinite;flex-shrink:0}
@keyframes pls{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}50%{box-shadow:0 0 0 8px rgba(34,197,94,0)}}
.livebar b{color:var(--txt)}
/* next match */
.next{position:relative;padding:20px 22px;margin-bottom:18px;border-radius:22px;overflow:hidden;color:#fff;
background:linear-gradient(120deg,var(--red),var(--red2));box-shadow:0 14px 38px rgba(158,27,34,.32);animation:rise .6s .05s cubic-bezier(.22,1,.36,1) both}
.next::after{content:"";position:absolute;top:-40px;right:-30px;width:210px;height:210px;transform:rotate(22deg);
background:repeating-linear-gradient(115deg,rgba(255,255,255,.12) 0 8px,transparent 8px 30px)}
.next .lb{position:relative;z-index:2;display:inline-flex;align-items:center;gap:7px;padding:4px 13px 5px;border-radius:999px;background:rgba(255,255,255,.2);font-size:.76rem;margin-bottom:11px}
.next .mt{position:relative;z-index:2;font-size:clamp(1.05rem,3.4vw,1.5rem);font-weight:600;line-height:1.35}
.next .mi{position:relative;z-index:2;margin-top:9px;font-size:.85rem;opacity:.9;font-weight:300}
.cd{position:relative;z-index:2;display:flex;gap:8px;margin-top:14px}
.cd div{min-width:60px;padding:9px 4px;border-radius:13px;background:rgba(255,255,255,.18);text-align:center}
.cd span{display:block;font-size:1.45rem;font-weight:700;line-height:1}
.cd small{font-size:.68rem;opacity:.85;font-weight:300}
/* nav */
.nav{position:sticky;top:10px;z-index:20;display:flex;gap:6px;padding:6px;margin-bottom:20px;border-radius:18px;box-shadow:var(--sh)}
.nav button{flex:1;padding:11px 14px;border:none;border-radius:13px;background:transparent;color:var(--txt2);font-family:inherit;font-size:.94rem;font-weight:500;cursor:pointer;transition:.28s;white-space:nowrap}
.nav button:hover{color:var(--red);background:var(--soft)}
.nav button.on{background:linear-gradient(120deg,var(--red),var(--red2));color:#fff;box-shadow:0 6px 18px rgba(158,27,34,.36)}
/* filter chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.chip{padding:7px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--txt2);font-family:inherit;font-size:.84rem;cursor:pointer;transition:.22s}
.chip:hover{transform:translateY(-2px)}
.chip.on{background:var(--txt);color:var(--bg);border-color:transparent}
/* cards */
.card{margin-bottom:22px;border-radius:22px;overflow:hidden;box-shadow:var(--sh);transition:.35s;animation:rise .55s cubic-bezier(.22,1,.36,1) both}
.card:hover{transform:translateY(-3px);box-shadow:var(--shl)}
.dt{display:flex;align-items:center;gap:11px;margin:0;padding:15px 20px;background:linear-gradient(115deg,var(--red),var(--red2));color:#fff;font-size:1.05rem;font-weight:600;position:relative;overflow:hidden}
.dt::after{content:"";position:absolute;top:-30px;right:-20px;width:150px;height:150px;transform:rotate(22deg);background:repeating-linear-gradient(115deg,rgba(255,255,255,.13) 0 7px,transparent 7px 26px)}
.dt b{display:grid;place-items:center;width:32px;height:32px;border-radius:11px;background:rgba(255,255,255,.22);font-size:.9rem;flex-shrink:0}
.mlist{padding:12px}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px;border-radius:15px;background:var(--solid);border:1px solid var(--line);transition:.25s}
.mrow:hover{transform:translateX(3px)}
.mrow.live{border-color:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.16)}
.mrow.done{opacity:.78}
.mtime{flex-shrink:0;width:58px;text-align:center}
.mtime b{display:block;color:var(--red);font-size:.98rem;font-weight:700}
[data-theme=dark] .mtime b{color:#ff8b95}
.mtime small{color:var(--txt3);font-size:.68rem;font-weight:300}
.mbody{flex:1;min-width:0}
.mtag{display:inline-block;padding:2px 10px 3px;border-radius:999px;color:#fff;font-size:.68rem;margin-bottom:4px}
.mvs{display:flex;align-items:center;gap:9px;font-size:.92rem;flex-wrap:wrap}
.mvs .tn{font-weight:500}
.mvs .tn.win{color:var(--g);font-weight:600}
[data-theme=dark] .mvs .tn.win{color:#4ade80}
.sc{padding:2px 11px 3px;border-radius:9px;background:var(--soft);color:var(--red);font-weight:700;font-size:.95rem}
[data-theme=dark] .sc{color:#ff8b95}
.mst{flex-shrink:0;font-size:.7rem;padding:4px 10px 5px;border-radius:999px;white-space:nowrap}
.st-live{background:#22c55e;color:#fff;animation:bl 1.5s infinite}
.st-done{background:var(--soft);color:var(--txt3)}
.st-wait{background:var(--soft);color:var(--txt3)}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.6}}
/* standings */
.sp-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.sp-tabs button{padding:10px 22px;border:1px solid var(--line);border-radius:14px;background:var(--card);backdrop-filter:var(--bl);color:var(--txt2);font-family:inherit;font-size:.92rem;font-weight:500;cursor:pointer;transition:.28s}
.sp-tabs button:hover{transform:translateY(-2px)}
.sp-tabs button.on{color:#fff;border-color:transparent;transform:translateY(-2px)}
.tools{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tools button,.srch{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border:1px solid var(--line);border-radius:12px;background:var(--card);backdrop-filter:var(--bl);color:var(--txt2);font-family:inherit;font-size:.84rem;cursor:pointer;transition:.25s}
.tools button:hover{border-color:var(--red);color:var(--red);transform:translateY(-2px)}
.srch{cursor:text;padding:0 13px}
.srch input{border:none;background:transparent;color:var(--txt);font-family:inherit;font-size:.84rem;padding:10px 0;width:130px;outline:none}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:16px}
.pod{position:relative;padding:19px 13px 16px;border-radius:20px;text-align:center;background:var(--card);backdrop-filter:var(--bl);border:1px solid var(--line);box-shadow:var(--sh);overflow:hidden;animation:pop .5s cubic-bezier(.34,1.56,.64,1) both}
.pod:nth-child(2){animation-delay:.08s}.pod:nth-child(3){animation-delay:.16s}
.pod::before{content:"";position:absolute;inset:0 0 auto;height:4px}
.pod.p1::before{background:linear-gradient(90deg,#f5d76e,#c9931b)}
.pod.p2::before{background:linear-gradient(90deg,#d9e0e5,#8e989e)}
.pod.p3::before{background:linear-gradient(90deg,#e8a76b,#a4652f)}
.pod.p1{transform:scale(1.04)}
.pod .md{font-size:1.8rem;line-height:1;margin-bottom:7px}
.pod .nm{font-size:.93rem;font-weight:600;margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pv{font-size:1.5rem;font-weight:700;color:var(--red);line-height:1}
[data-theme=dark] .pod .pv{color:#ff8b95}
.pod .pl{color:var(--txt3);font-size:.72rem;margin-top:3px;font-weight:300}
.board{position:relative;padding:24px 22px 28px;border-radius:24px;overflow:hidden;background:var(--card);backdrop-filter:var(--bl);border:1px solid var(--line);box-shadow:var(--shl);animation:rise .55s cubic-bezier(.22,1,.36,1) both}
.board::before{content:"";position:absolute;top:-80px;left:-70px;width:300px;height:300px;transform:rotate(24deg);pointer-events:none;background:repeating-linear-gradient(115deg,var(--soft) 0 10px,transparent 10px 36px)}
.bh{position:relative;z-index:2;display:flex;align-items:center;gap:16px;margin-bottom:18px}
.bh>img{width:66px;height:66px;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(158,27,34,.25))}
.bh h2{margin:0;font-size:clamp(1.4rem,3.8vw,2.2rem);font-weight:700;line-height:1;background:linear-gradient(100deg,var(--red),var(--red2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.bh .sub{display:inline-block;margin-top:8px;padding:5px 18px 7px;border-radius:7px;background:var(--txt);color:var(--bg);font-size:clamp(.82rem,2.1vw,1.02rem);font-weight:500;transform:skewX(-9deg)}
.bh .sub span{display:inline-block;transform:skewX(9deg)}
.bw{position:relative;z-index:2;border-radius:16px;overflow:hidden;background:var(--solid);border:1px solid var(--line)}
.bs{overflow-x:auto;-webkit-overflow-scrolling:touch}
.std{width:100%;min-width:720px;border-collapse:collapse}
.std thead th{padding:13px 8px;background:linear-gradient(180deg,var(--red2),var(--red));color:#fff;font-size:.86rem;font-weight:600;text-align:center;white-space:nowrap}
.std thead th:first-child{width:56px}
.std thead th:nth-child(2){min-width:180px;text-align:left;padding-left:18px}
.std tbody tr{animation:sl .4s cubic-bezier(.22,1,.36,1) both;transition:.22s}
.std tbody td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:center;font-size:.93rem}
.std tbody tr:nth-child(even){background:var(--soft)}
.std tbody tr:hover{background:var(--soft)}
.std tbody tr.hit{background:rgba(217,165,32,.2)!important;box-shadow:inset 3px 0 0 var(--gold)}
.std tbody td:nth-child(2){text-align:left;padding-left:18px;font-weight:500}
.rk{display:inline-grid;place-items:center;width:29px;height:29px;border-radius:10px;background:var(--txt3);color:#fff;font-size:.84rem;font-weight:600}
.r1{background:linear-gradient(145deg,#f5d76e,#c9931b)}.r2{background:linear-gradient(145deg,#d9e0e5,#8e989e)}.r3{background:linear-gradient(145deg,#e8a76b,#a4652f)}
.pts{color:var(--red);font-size:1.08rem;font-weight:700}
[data-theme=dark] .pts{color:#ff8b95}
.pos{color:var(--g);font-weight:500}[data-theme=dark] .pos{color:#4ade80}
.neg{color:#dc3545;font-weight:500}[data-theme=dark] .neg{color:#ff7b8a}
.bf{position:relative;z-index:2;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:13px;color:var(--txt3);font-size:.79rem}
.empty{padding:50px 20px;text-align:center;color:var(--txt3)}
/* feed */
.feed{display:grid;gap:9px}
.fitem{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:16px;box-shadow:var(--sh);animation:sl .4s both}
.fitem .fs{padding:4px 13px 5px;border-radius:10px;background:var(--soft);color:var(--red);font-weight:700;font-size:1rem;flex-shrink:0}
[data-theme=dark] .fitem .fs{color:#ff8b95}
/* modal */
.modal{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(10,13,16,.72);backdrop-filter:blur(6px)}
.modal.show{display:flex}
.mbox{max-width:340px;width:100%;padding:28px 24px;border-radius:22px;background:var(--solid);text-align:center;box-shadow:var(--shl)}
.mbox img{width:200px;height:200px;border-radius:14px;background:#fff;padding:9px;margin-bottom:14px}
.mbox h3{margin:0 0 6px;color:var(--red);font-size:1.08rem}
.mbox p{margin:0 0 16px;color:var(--txt3);font-size:.82rem;word-break:break-all}
.mbox button{width:100%;padding:11px;border:none;border-radius:12px;background:var(--red);color:#fff;font-family:inherit;font-size:.92rem;cursor:pointer}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);padding:12px 24px;border-radius:12px;background:#1f2422;color:#fff;font-size:.9rem;opacity:0;transition:.3s;z-index:100}
.toast.show{transform:translateX(-50%);opacity:1}
.foot{margin-top:32px;text-align:center;color:var(--txt3);font-size:.83rem;font-weight:300}
.foot a{color:var(--line);text-decoration:none}
.hidden{display:none}
body.tv .head,body.tv .nav,body.tv .tools,body.tv .foot,body.tv .mesh,body.tv .livebar{display:none}
body.tv .page{max-width:100%;padding:12px}
body.tv .std tbody td{padding:16px 8px;font-size:1.18rem}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
@keyframes sl{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:820px){.podium{grid-template-columns:1fr;gap:8px}.pod.p1{transform:none}
.pod{display:flex;align-items:center;gap:14px;text-align:left;padding:13px 16px}
.pod .md{margin:0;font-size:1.4rem}.pod .nm{flex:1;margin:0}.pod .pv{font-size:1.25rem}}
@media(max-width:680px){.page{padding:16px 12px 60px}.head{gap:12px;padding:15px 16px;border-radius:20px}
.head>img{width:48px;height:48px}.head p{font-size:.76rem}.ic{width:38px;height:38px;font-size:1rem}
.nav button{padding:10px 10px;font-size:.86rem}.board{padding:16px 13px 20px}
.bh{gap:11px}.bh>img{width:46px;height:46px}.srch{flex:1}.srch input{width:100%}
.mrow{gap:9px;padding:11px}.mtime{width:48px}}
</style>
</head>
<body>
<div class="mesh"><i></i><i></i><i></i></div>
<div class="wm"><img src="cpe-logo.png" alt=""></div>

<main class="page">
  <header class="head glass">
    <img src="cpe-logo.png" alt="CPE">
    <div>
      <h1>กีฬาภายใน วิศวกรรมคอมพิวเตอร์</h1>

    </div>
    <button class="ic" onclick="share()" title="แชร์ / QR">📤</button>
    <button class="ic" id="thBtn" onclick="toggleTheme()" title="สลับโหมด">🌙</button>
  </header>

  <div class="livebar glass">
    <span class="dotlive"></span>
    <span>เชื่อมต่อสด · <b id="liveTxt">กำลังโหลด...</b></span>
  </div>

  <div id="nextHost"></div>

    <button class="on" onclick="go('sch',this)">📅 ตารางแข่ง</button>

      <button onclick="saveImg()">📷 บันทึกรูป</button>

  <footer class="foot">
    Computer Engineering • Lampang Rajabhat University<br>
    <a href="admin.html">·</a> <a href="ref.html">·</a>

</main>

<div class="modal" id="qrM" onclick="this.classList.remove('show')">
  <div class="mbox" onclick="event.stopPropagation()">
    <img id="qrImg" src="" alt="QR">
    <h3>สแกนเพื่อเปิดเว็บ</h3>
    <p id="qrUrl"></p>
    <button onclick="copyLink()">📋 คัดลอกลิงก์</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="config.js"></script>
<script>
let SP=[],TM=[],MT=[],curSp=0,curYr='all';
const LIVE_MIN=45;

/* ---------- ธีม ---------- */
function toggleTheme(){
  const d=document.documentElement.dataset.theme==='dark';
  document.documentElement.dataset.theme=d?'light':'dark';
  document.getElementById('thBtn').textContent=d?'🌙':'☀️';
  localStorage.setItem('cpe_theme',d?'light':'dark');
}
(()=>{const t=localStorage.getItem('cpe_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
document.documentElement.dataset.theme=t;
addEventListener('DOMContentLoaded',()=>document.getElementById('thBtn').textContent=t==='dark'?'☀️':'🌙');})();

/* ---------- โหลดข้อมูล ---------- */
async function load(){
  const [s,t,m]=await Promise.all([
    sb.from('sports').select('*').order('sort_order'),
    sb.from('teams').select('*').order('sort_order'),
    sb.from('matches').select('*').order('match_date').order('match_time').order('court')
  ]);
  SP=s.data||[];TM=t.data||[];MT=m.data||[];
  document.getElementById('liveTxt').textContent=
    `${SP.length} ประเภทกีฬา · ${MT.length} แมตช์ · อัปเดต ${new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})} น.`;
  drawFilter();drawSch();drawTabs();drawBoard();drawFeed();drawNext();
}

/* ---------- แมตช์ถัดไป ---------- */
let cdT=null;
function drawNext(){
  const now=new Date();
  const up=MT.filter(m=>m.status!=='done'&&m.match_date).map(m=>({m,d:mDT(m)}))
    .filter(o=>o.d.getTime()+LIVE_MIN*6e4>now.getTime()).sort((a,b)=>a.d-b.d);
  const host=document.getElementById('nextHost');
  if(!up.length){host.innerHTML='';clearInterval(cdT);return;}
  const {m,d}=up[0],sp=SP.find(x=>x.id===m.sport_id)||{},
    A=TM.find(t=>t.id===m.team_a),B=TM.find(t=>t.id===m.team_b),
    isLive=now>=d&&now.getTime()<d.getTime()+LIVE_MIN*6e4;
  host.innerHTML=`<div class="next">
    <span class="lb">${isLive?'🔴 กำลังแข่งอยู่':'⏭ แมตช์ถัดไป'}</span>
    <div class="mt">${esc(A?.name||'?')} <span style="opacity:.7">VS</span> ${esc(B?.name||'?')}</div>
    <div class="mi">${esc(sp.name||'')} · สนาม ${m.court} · ${esc(m.match_time)} น. · ${thDate(m.match_date)}</div>
    ${isLive?'':`<div class="cd" id="cd"></div>`}
  </div>`;
  clearInterval(cdT);
  if(!isLive){
    const tick=()=>{
      const s=Math.max(0,Math.floor((d-new Date())/1000));
      const el=document.getElementById('cd');if(!el)return clearInterval(cdT);
      if(s<=0){clearInterval(cdT);drawNext();return;}
      const D=Math.floor(s/86400),H=Math.floor(s%86400/3600),M=Math.floor(s%3600/60),S=s%60;
      el.innerHTML=[[D,'วัน'],[H,'ชม.'],[M,'นาที'],[S,'วินาที']]
        .filter((v,i)=>i>0||D>0).map(([v,l])=>`<div><span>${String(v).padStart(2,'0')}</span><small>${l}</small></div>`).join('');
    };tick();cdT=setInterval(tick,1000);
  }
}

/* ---------- ตัวกรอง ---------- */
function drawFilter(){
  const ys=[...new Set(TM.map(t=>t.year_group).filter(Boolean))].sort();
  document.getElementById('filt').innerHTML=
    `<button class="chip ${curYr==='all'?'on':''}" onclick="setYr('all')">ทั้งหมด</button>`+
    ys.map(y=>`<button class="chip ${curYr===y?'on':''}" onclick="setYr('${esc(y)}')">${esc(y)}</button>`).join('');
}
function setYr(y){curYr=y;drawFilter();drawSch();}

/* ---------- ตารางแข่ง ---------- */
function drawSch(){
  const now=new Date(),days={};
  MT.forEach(m=>{
    if(curYr!=='all'){
      const A=TM.find(t=>t.id===m.team_a),B=TM.find(t=>t.id===m.team_b);
      if(A?.year_group!==curYr&&B?.year_group!==curYr)return;
    }
    (days[m.match_date]=days[m.match_date]||[]).push(m);
  });
  const keys=Object.keys(days).sort();
  document.getElementById('schHost').innerHTML=keys.length?keys.map((k,i)=>`
    <section class="card glass" style="animation-delay:${i*.06}s">
      <h2 class="dt"><b>📅</b> ${thDate(k)}</h2>
      <div class="mlist">${days[k].map(m=>mrow(m,now)).join('')}</div>
    </section>`).join(''):'<p class="empty">ยังไม่มีแมตช์ในรายการนี้</p>';
}
function mrow(m,now){
  const sp=SP.find(x=>x.id===m.sport_id)||{color:'#888',name:''},
    A=TM.find(t=>t.id===m.team_a),B=TM.find(t=>t.id===m.team_b),d=mDT(m),
    live=m.status==='live'||(m.status!=='done'&&now>=d&&now.getTime()<d.getTime()+LIVE_MIN*6e4),
    done=m.status==='done';
  const wA=done&&m.score_a>m.score_b,wB=done&&m.score_b>m.score_a;
  return `<div class="mrow ${live?'live':''} ${done?'done':''}">
    <div class="mtime"><b>${esc(m.match_time)}</b><small>สนาม ${m.court}</small></div>
    <div class="mbody">
      <span class="mtag" style="background:${sp.color}">${esc(sp.name)}</span>
      <div class="mvs">
        <span class="tn ${wA?'win':''}">${esc(A?.name||'?')}</span>
        ${done?`<span class="sc">${m.score_a} : ${m.score_b}</span>`:'<span style="color:var(--txt3);font-size:.8rem">VS</span>'}
        <span class="tn ${wB?'win':''}">${esc(B?.name||'?')}</span>
      </div>
    </div>
    <span class="mst ${live?'st-live':done?'st-done':'st-wait'}">${live?'🔴 LIVE':done?'จบแล้ว':'รอแข่ง'}</span>
  </div>`;
}

/* ---------- ตารางคะแนน ---------- */
function drawTabs(){
  document.getElementById('spTabs').innerHTML=SP.map((s,i)=>
    `<button class="${i===curSp?'on':''}" style="${i===curSp?`background:linear-gradient(120deg,${s.color},${s.color}cc);box-shadow:0 6px 18px ${s.color}55`:''}"
      onclick="pickSp(${i})">${esc(s.name)}</button>`).join('');
}
function pickSp(i){curSp=i;drawTabs();drawBoard();}
function drawBoard(){
  const sp=SP[curSp],pod=document.getElementById('podHost'),host=document.getElementById('boardHost');
  if(!sp){pod.innerHTML='';host.innerHTML='<p class="empty">ยังไม่มีประเภทกีฬา</p>';return;}
  const rows=standings(sp,TM.filter(t=>t.sport_id===sp.id),MT.filter(m=>m.sport_id===sp.id)),md=['🥇','🥈','🥉'];
  pod.innerHTML=rows.length>=3?`<div class="podium">${rows.slice(0,3).map((t,i)=>`
    <div class="pod p${i+1}"><div class="md">${md[i]}</div><div class="nm">${esc(t.n)}</div>
    <div><div class="pv">${t.pt}</div><div class="pl">แต้ม · แข่ง ${t.pl} นัด</div></div></div>`).join('')}</div>`:'';
  host.innerHTML=`<div class="board" id="capture">
    <div class="bh"><img src="cpe-logo.png" alt="">
      <div><h2>ตารางคะแนน</h2><div class="sub"><span>${esc(sp.name)}</span></div></div></div>
    <div class="bw"><div class="bs"><table class="std">
      <thead><tr><th>#</th><th>ทีม</th><th>แข่ง</th><th>ชนะ</th><th>แพ้</th><th>เสมอ</th>
      <th>ได้</th><th>เสีย</th><th>ผลต่าง</th><th>แต้ม</th></tr></thead>
      <tbody>${rows.length?rows.map((t,i)=>`<tr data-n="${esc(t.n).toLowerCase()}" style="animation-delay:${i*.04}s">
        <td><span class="rk ${i<3?'r'+(i+1):''}">${i+1}</span></td><td>${esc(t.n)}</td>
        <td>${t.pl}</td><td>${t.w}</td><td>${t.l}</td><td>${t.d}</td><td>${t.gf}</td><td>${t.ga}</td>
        <td class="${t.df>0?'pos':t.df<0?'neg':''}">${t.df>0?'+':''}${t.df}</td>
        <td class="pts">${t.pt}</td></tr>`).join(''):'<tr><td colspan="10" class="empty">ยังไม่มีทีม</td></tr>'}</tbody>
    </table></div></div>
    <div class="bf"><span>ชนะ ${sp.win_pt} · เสมอ ${sp.draw_pt} · แพ้ ${sp.lose_pt} แต้ม</span>
      <span>อัปเดตสด ${new Date().toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})} น.</span></div>
  </div>`;
  const q=document.getElementById('q').value;if(q)find(q);
}
function find(v){
  const k=v.trim().toLowerCase();
  document.querySelectorAll('.std tbody tr[data-n]').forEach(tr=>
    tr.classList.toggle('hit',!!k&&tr.dataset.n.includes(k)));
}

/* ---------- ผลล่าสุด ---------- */
function drawFeed(){
  const done=MT.filter(m=>m.status==='done').sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at)).slice(0,25);
  document.getElementById('feedHost').innerHTML=done.length?done.map((m,i)=>{
    const sp=SP.find(x=>x.id===m.sport_id)||{color:'#888',name:''},
      A=TM.find(t=>t.id===m.team_a),B=TM.find(t=>t.id===m.team_b),
      wA=m.score_a>m.score_b,wB=m.score_b>m.score_a;
    return `<div class="fitem glass" style="animation-delay:${i*.04}s">
      <span class="mtag" style="background:${sp.color};flex-shrink:0">${esc(sp.name)}</span>
      <div style="flex:1;min-width:0">
        <div class="mvs"><span class="tn ${wA?'win':''}">${esc(A?.name||'?')}</span>
        <span class="fs">${m.score_a} : ${m.score_b}</span>
        <span class="tn ${wB?'win':''}">${esc(B?.name||'?')}</span></div>
        <div style="color:var(--txt3);font-size:.75rem;margin-top:3px">${thDate(m.match_date)} · ${esc(m.match_time)} น. · สนาม ${m.court}</div>
      </div></div>`;
  }).join(''):'<p class="empty">ยังไม่มีผลการแข่งขัน</p>';
}

/* ---------- Realtime ---------- */
sb.channel('cpe-live')
  .on('postgres_changes',{event:'*',schema:'public',table:'matches'},()=>{load();toast('🔄 มีผลใหม่เข้ามา!')})
  .on('postgres_changes',{event:'*',schema:'public',table:'teams'},load)
  .on('postgres_changes',{event:'*',schema:'public',table:'sports'},load)
  .subscribe();

/* ---------- เครื่องมือ ---------- */
function go(n,btn){
  ['sch','std','res'].forEach(k=>document.getElementById('p-'+k).classList.toggle('hidden',k!==n));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');scrollTo({top:0,behavior:'smooth'});
}
function saveImg(){
  html2canvas(document.getElementById('capture'),{scale:2,backgroundColor:getComputedStyle(document.body).backgroundColor,useCORS:true})
  .then(cv=>{const a=document.createElement('a');a.download='คะแนน-'+(SP[curSp]?.name||'board')+'.png';
    a.href=cv.toDataURL('image/png');a.click();}).catch(()=>toast('บันทึกรูปไม่สำเร็จ'));
}
function tv(){document.body.classList.toggle('tv');
  document.body.classList.contains('tv')?document.documentElement.requestFullscreen?.():document.exitFullscreen?.();}
addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('tv')});
function share(){
  const u=location.origin+location.pathname;
  if(navigator.share)navigator.share({title:'กีฬาภายใน CPE',url:u}).catch(()=>qr(u));
  else qr(u);
}
function qr(u){
  document.getElementById('qrImg').src='https://api.qrserver.com/v1/create-qr-code/?size=400x400&data='+encodeURIComponent(u);
  document.getElementById('qrUrl').textContent=u;
  document.getElementById('qrM').classList.add('show');
}
function copyLink(){navigator.clipboard.writeText(location.origin+location.pathname);toast('📋 คัดลอกแล้ว')}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2400);}

load();
setInterval(()=>{drawSch();drawNext();},30000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
