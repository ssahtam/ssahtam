<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9e1b22">
<meta name="robots" content="noindex,nofollow">
<title>กรอกคะแนน | กรรมการ</title>
<link rel="icon" href="cpe-logo.png">
<link rel="apple-touch-icon" href="cpe-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#9e1b22;--red2:#c93341;--g:#05864a;--bg:#0e1116;--card:#1c222b;--card2:#242c37;
--txt:#e9edf2;--txt2:#a2adba;--txt3:#6f7c8a;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;font-family:Kanit,sans-serif;background:var(--bg);color:var(--txt);
padding-bottom:env(safe-area-inset-bottom);overscroll-behavior:none}
.wrap{max-width:520px;margin:auto;padding:18px 14px 40px}
/* login */
.gate{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:22px}
.gbox{width:100%;max-width:340px;text-align:center}
.gbox img{width:86px;margin-bottom:16px;filter:drop-shadow(0 6px 16px rgba(158,27,34,.4))}
.gbox h1{margin:0 0 5px;font-size:1.3rem;color:#ff8b95}
.gbox p{margin:0 0 22px;color:var(--txt3);font-size:.85rem}
.pin{display:flex;gap:9px;justify-content:center;margin-bottom:18px}
.pin span{width:52px;height:60px;border-radius:15px;background:var(--card);border:2px solid var(--line);
display:grid;place-items:center;font-size:1.6rem;font-weight:700;transition:.2s}
.pin span.f{border-color:var(--red2);background:var(--card2)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:62px;border:none;border-radius:17px;background:var(--card);color:var(--txt);
font-family:inherit;font-size:1.5rem;font-weight:500;cursor:pointer;transition:.12s}
.pad button:active{background:var(--red);transform:scale(.94)}
.pad button.fn{font-size:1.1rem;color:var(--txt2)}
.err{min-height:22px;margin-top:12px;color:#ff7b8a;font-size:.86rem}
/* header */
.hd{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:14px;
border-radius:18px;background:linear-gradient(120deg,var(--red),var(--red2));box-shadow:0 8px 24px rgba(158,27,34,.34)}
.hd img{width:40px;height:40px;object-fit:contain}
.hd div{flex:1;min-width:0}
.hd h1{margin:0;font-size:1.02rem;font-weight:600}
.hd p{margin:2px 0 0;font-size:.74rem;opacity:.85;font-weight:300}
.hd button{width:38px;height:38px;border:none;border-radius:12px;background:rgba(255,255,255,.2);
color:#fff;font-size:1rem;cursor:pointer}
/* tabs */
.st{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.st::-webkit-scrollbar{display:none}
.st button{flex-shrink:0;padding:9px 18px;border:1px solid var(--line);border-radius:13px;
background:var(--card);color:var(--txt2);font-family:inherit;font-size:.86rem;cursor:pointer;white-space:nowrap}
.st button.on{color:#fff;border-color:transparent}
.fl{display:flex;gap:6px;margin-bottom:14px}
.fl button{flex:1;padding:9px;border:1px solid var(--line);border-radius:12px;background:var(--card);
color:var(--txt2);font-family:inherit;font-size:.82rem;cursor:pointer}
.fl button.on{background:var(--txt);color:var(--bg);border-color:transparent}
/* match card */
.mc{padding:14px 16px;margin-bottom:10px;border-radius:18px;background:var(--card);
border:1px solid var(--line);cursor:pointer;transition:.2s}
.mc:active{transform:scale(.985)}
.mc.live{border-color:#22c55e;box-shadow:0 0 0 2px rgba(34,197,94,.2)}
.mc.done{opacity:.62}
.mc .top{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:.72rem;color:var(--txt3)}
.tg{padding:2px 10px 3px;border-radius:999px;color:#fff;font-size:.68rem}
.mc .vs{display:flex;align-items:center;gap:10px;font-size:.95rem}
.mc .vs .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc .vs .t.r{text-align:right}
.mc .vs .s{padding:4px 13px 5px;border-radius:11px;background:var(--card2);font-weight:700;font-size:1.02rem;color:#ff8b95}
.badge{margin-left:auto;padding:3px 10px 4px;border-radius:999px;font-size:.66rem}
.b-live{background:#22c55e;color:#fff}.b-done{background:var(--card2);color:var(--txt3)}
.b-wait{background:var(--card2);color:var(--txt3)}
/* editor */
.ov{position:fixed;inset:0;z-index:60;display:none;background:var(--bg);overflow-y:auto}
.ov.show{display:block}
.ed{max-width:520px;margin:auto;padding:18px 14px 40px}
.eh{display:flex;align-items:center;gap:11px;margin-bottom:20px}
.eh button{width:40px;height:40px;border:none;border-radius:13px;background:var(--card);color:var(--txt);font-size:1.1rem;cursor:pointer}
.eh h2{margin:0;flex:1;font-size:1rem;font-weight:500}
.tc{padding:18px 16px;margin-bottom:12px;border-radius:20px;background:var(--card);border:2px solid var(--line);text-align:center}
.tc.lead{border-color:var(--g);background:rgba(5,134,74,.1)}
.tc .n{font-size:1.02rem;font-weight:600;margin-bottom:13px;min-height:26px}
.ctl{display:flex;align-items:center;justify-content:center;gap:16px}
.ctl button{width:56px;height:56px;border:none;border-radius:18px;background:var(--card2);
color:var(--txt);font-size:1.7rem;font-weight:300;cursor:pointer;transition:.12s;display:grid;place-items:center}
.ctl button:active{transform:scale(.9);background:var(--red)}
.ctl .v{min-width:88px;font-size:3.1rem;font-weight:700;line-height:1;color:#ff8b95}
.qk{display:flex;gap:6px;justify-content:center;margin-top:13px;flex-wrap:wrap}
.qk button{padding:6px 15px;border:1px solid var(--line);border-radius:11px;background:transparent;
color:var(--txt3);font-family:inherit;font-size:.8rem;cursor:pointer}
.qk button:active{background:var(--card2)}
.mid{text-align:center;color:var(--txt3);font-size:.9rem;margin:6px 0 12px;font-weight:300}
.acts{display:grid;gap:9px;margin-top:20px}
.acts button{padding:15px;border:none;border-radius:16px;font-family:inherit;font-size:1rem;
font-weight:600;cursor:pointer;transition:.15s}
.acts button:active{transform:scale(.98)}
.a-live{background:#22c55e;color:#fff}
.a-done{background:linear-gradient(120deg,var(--red),var(--red2));color:#fff;box-shadow:0 8px 22px rgba(158,27,34,.4)}
.a-rst{background:var(--card);color:var(--txt2)}
.info{padding:12px 15px;margin-bottom:16px;border-radius:14px;background:var(--card);
color:var(--txt3);font-size:.8rem;line-height:1.6}
.empty{padding:46px 16px;text-align:center;color:var(--txt3);font-size:.88rem}
.tst{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(90px);
padding:13px 26px;border-radius:13px;background:#fff;color:#111;font-size:.9rem;font-weight:500;
opacity:0;transition:.3s;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.tst.show{transform:translateX(-50%);opacity:1}
.hidden{display:none}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gbox">
    <img src="cpe-logo.png" alt="CPE">
    <h1>ระบบกรรมการ</h1>
    <p>กรอก PIN 4 หลักเพื่อเข้าใช้งาน</p>
    <div class="pin" id="pinBox"><span></span><span></span><span></span><span></span></div>
    <div class="pad">
      
      <button onclick="k('1')">1</button><button onclick="k('2')">2</button><button onclick="k('3')">3</button>
      <button onclick="k('4')">4</button><button onclick="k('5')">5</button><button onclick="k('6')">6</button>
      <button onclick="k('7')">7</button><button onclick="k('8')">8</button><button onclick="k('9')">9</button>
      <button class="fn" onclick="k('c')">ล้าง</button><button onclick="k('0')">0</button>
      <button class="fn" onclick="k('b')">⌫</button>
    </div>
    <div class="err" id="err"></div>
  </div>
</div>

<div class="wrap hidden" id="app">
  <div class="hd">
    <img src="cpe-logo.png" alt="">
    <div><h1>กรอกคะแนนสด</h1><p id="hdSub">กำลังโหลด...</p></div>
    <button onclick="logout()">⏻</button>
  </div>
  <div class="info">👆 แตะที่แมตช์เพื่อกรอกคะแนน · ผลจะขึ้นหน้าเว็บทันทีที่กด <b>บันทึกผล</b></div>
  <div class="st" id="spTabs"></div>
  <div class="fl">
    <button class="on" onclick="setF('today',this)">วันนี้</button>
    <button onclick="setF('wait',this)">ยังไม่แข่ง</button>
    <button onclick="setF('all',this)">ทั้งหมด</button>
  </div>
  <div id="list"></div>
</div>

<div class="ov" id="ov">
  <div class="ed">
    <div class="eh">
      <button onclick="closeEd()">←</button>
      <h2 id="edTtl"></h2>
    </div>
    <div class="tc" id="tcA">
      <div class="n" id="nA"></div>
      <div class="ctl">
        <button onclick="adj('a',-1)">−</button>
        <span class="v" id="vA">0</span>
        <button onclick="adj('a',1)">+</button>
      </div>
      <div class="qk">
        <button onclick="setV('a',0)">0</button><button onclick="setV('a',7)">7</button>
        <button onclick="setV('a',11)">11</button><button onclick="setV('a',13)">13</button>
      </div>
    </div>
    <div class="mid">— VS —</div>
    <div class="tc" id="tcB">
      <div class="n" id="nB"></div>
      <div class="ctl">
        <button onclick="adj('b',-1)">−</button>
        <span class="v" id="vB">0</span>
        <button onclick="adj('b',1)">+</button>
      </div>
      <div class="qk">
        <button onclick="setV('b',0)">0</button><button onclick="setV('b',7)">7</button>
        <button onclick="setV('b',11)">11</button><button onclick="setV('b',13)">13</button>
      </div>
    </div>
    <div class="acts">
      <button class="a-live" onclick="send('live')">🔴 เริ่มแข่ง / อัปเดตสด</button>
      <button class="a-done" onclick="send('done')">✅ บันทึกผล (จบแมตช์)</button>
      <button class="a-rst" onclick="send('pending')">↺ ยกเลิกผล กลับเป็นรอแข่ง</button>
    </div>
  </div>
</div>

<div class="tst" id="tst"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
let PIN='',pin='',SP=[],TM=[],MT=[],curSp='all',curF='today',cur=null,A=0,B=0;

/* ---------- PIN ---------- */
function k(x){
  if(x==='c')pin='';else if(x==='b')pin=pin.slice(0,-1);
  else if(pin.length<4)pin+=x;
  document.querySelectorAll('#pinBox span').forEach((s,i)=>{
    s.textContent=pin[i]?'●':'';s.classList.toggle('f',!!pin[i]);});
  if(pin.length===4)check();
}
async function check(){
  // แก้จากของเดิม ให้เป็นแบบนี้
const { data, error } = await sb.rpc('verify_pin', { p_pin: pin, p_role: 'referee' });


  if(error||!data){
    document.getElementById('err').textContent='❌ PIN ไม่ถูกต้อง';
    pin='';setTimeout(()=>k('c'),400);
    if(navigator.vibrate)navigator.vibrate([60,50,60]);
    return;
  }
  PIN=pin;sessionStorage.setItem('cpe_ref',PIN);start();
}
function start(){
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  load();
}
function logout(){sessionStorage.removeItem('cpe_ref');location.reload();}
(()=>{const s=sessionStorage.getItem('cpe_ref');if(s){PIN=s;start();}})();

/* ---------- โหลด ---------- */
async function load(){
  const [s,t,m]=await Promise.all([
    sb.from('sports').select('*').order('sort_order'),
    sb.from('teams').select('*').order('sort_order'),
    sb.from('matches').select('*').order('match_date').order('match_time').order('court')
  ]);
  SP=s.data||[];TM=t.data||[];MT=m.data||[];
  document.getElementById('hdSub').textContent=
    `${MT.filter(x=>x.status==='done').length}/${MT.length} แมตช์เสร็จแล้ว`;
  tabs();list();
}
function tabs(){
  document.getElementById('spTabs').innerHTML=
    `<button class="${curSp==='all'?'on':''}" style="${curSp==='all'?'background:#9e1b22':''}" onclick="pk('all')">ทุกประเภท</button>`+
    SP.map(s=>`<button class="${curSp===s.id?'on':''}" style="${curSp===s.id?'background:'+s.color:''}"
      onclick="pk('${s.id}')">${esc(s.name)}</button>`).join('');
}
function pk(id){curSp=id;tabs();list();}
function setF(f,b){curF=f;document.querySelectorAll('.fl button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');list();}

function list(){
  const today=new Date().toISOString().slice(0,10);
  let arr=MT.filter(m=>curSp==='all'||m.sport_id===curSp);
  if(curF==='today')arr=arr.filter(m=>m.match_date===today);
  else if(curF==='wait')arr=arr.filter(m=>m.status!=='done');
  const now=new Date();
  document.getElementById('list').innerHTML=arr.length?arr.map(m=>{
    const sp=SP.find(x=>x.id===m.sport_id)||{color:'#888',name:''},
      a=TM.find(t=>t.id===m.team_a),b=TM.find(t=>t.id===m.team_b),
      d=mDT(m),done=m.status==='done',
      live=m.status==='live'||(!done&&now>=d&&now-d<45*6e4);
    return `<div class="mc ${live?'live':''} ${done?'done':''}" onclick="openEd('${m.id}')">
      <div class="top"><span class="tg" style="background:${sp.color}">${esc(sp.name)}</span>
        <span>${esc(m.match_time)} น. · สนาม ${m.court}</span>
        <span class="badge ${live?'b-live':done?'b-done':'b-wait'}">${live?'🔴 LIVE':done?'จบแล้ว':'รอแข่ง'}</span></div>
      <div class="vs"><span class="t r">${esc(a?.name||'?')}</span>
        <span class="s">${done||m.score_a!=null?`${m.score_a??0} : ${m.score_b??0}`:'–'}</span>
        <span class="t">${esc(b?.name||'?')}</span></div>
    </div>`;}).join(''):'<p class="empty">ไม่มีแมตช์ในเงื่อนไขนี้</p>';
}

/* ---------- แก้คะแนน ---------- */
function openEd(id){
  cur=MT.find(m=>m.id===id);if(!cur)return;
  const a=TM.find(t=>t.id===cur.team_a),b=TM.find(t=>t.id===cur.team_b),
    sp=SP.find(s=>s.id===cur.sport_id)||{};
  A=cur.score_a??0;B=cur.score_b??0;
  document.getElementById('edTtl').textContent=`${sp.name||''} · สนาม ${cur.court} · ${cur.match_time} น.`;
  document.getElementById('nA').textContent=a?.name||'?';
  document.getElementById('nB').textContent=b?.name||'?';
  paint();document.getElementById('ov').classList.add('show');
}
function closeEd(){document.getElementById('ov').classList.remove('show');cur=null;}
function paint(){
  document.getElementById('vA').textContent=A;
  document.getElementById('vB').textContent=B;
  document.getElementById('tcA').classList.toggle('lead',A>B);
  document.getElementById('tcB').classList.toggle('lead',B>A);
}
function adj(w,n){
  if(w==='a')A=Math.max(0,A+n);else B=Math.max(0,B+n);
  paint();if(navigator.vibrate)navigator.vibrate(14);
}
function setV(w,n){if(w==='a')A=n;else B=n;paint();if(navigator.vibrate)navigator.vibrate(14);}

async function send(st){
  if(!cur)return;
  if(st==='done'&&A===0&&B===0&&!confirm('คะแนน 0-0 ต้องการบันทึกจริงหรือไม่?'))return;
  const {error}=await sb.rpc('submit_score',
    {p_pin:PIN,p_match:cur.id,p_a:A,p_b:B,p_status:st});
  if(error){toast('❌ '+error.message);return;}
  toast(st==='done'?'✅ บันทึกผลแล้ว!':st==='live'?'🔴 อัปเดตสดแล้ว':'↺ ยกเลิกผลแล้ว');
  if(navigator.vibrate)navigator.vibrate([40,30,70]);
  await load();
  if(st!=='live')closeEd();
}

sb.channel('ref-live').on('postgres_changes',
  {event:'*',schema:'public',table:'matches'},load).subscribe();

let tt;function toast(m){const t=document.getElementById('tst');t.textContent=m;t.classList.add('show');
  clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200);}
</script>
</body>
</html>
